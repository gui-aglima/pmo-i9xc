<style>
/* Layout: cabeçalho fixo com navegação; portfólio em cards; projeto em linha do tempo + fases recolhíveis. Identidade i9 (roxo, âmbar, royal). */
:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;

  --purple:#A58BF0;--indigo:#A9A7F5;--royal:#8D8DFF;--royal-tint:#25254F;--amber-tint:#3A2A12;--amber-ink:#FFC980;
  --green:#4CD08F;--green-tint:#12301F;--coral:#FF7A68;--coral-tint:#3A1A17;--warn-tint:#3A2C10;--lav:#26224A;--focus:0 0 0 3px rgba(141,141,255,.4)}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0E0D1F;--surface:#17162C;--surface2:#1E1D38;--line:#2B2A4A;--line2:#3C3A63;--ink:#ECEBFA;--muted:#B0AED0;--soft:#8280A8;
  --purple:#A58BF0;--indigo:#A9A7F5;--royal:#8D8DFF;--royal-tint:#25254F;--amber-tint:#3A2A12;--amber-ink:#FFC980;

.card{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--purple);border-radius:16px;padding:16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:12px;min-width:0;width:100%}

.ovc .ob{height:9px;border-radius:6px;background:var(--line);margin:9px 0 6px;overflow:hidden}.ovc .ob i{display:block;height:100%;border-radius:6px}

function evalRule(T,d){
  if(d.cli){const v=tv(T,d.cli);return v==='sim'?{s:'cli',why:'Termo: '+FLD[d.cli].l+' = Sim',pend:[]}:{s:'on',why:'',pend:v===''?[d.cli]:[]}}
  const items=[];
  (d.r||[]).forEach(id=>items.push({id,s:sR(T,id),v:tv(T,id)}));
  (d.y||[]).forEach(id=>items.push({id,s:sY(T,id),v:tv(T,id)}));
  if(d.canais&&((T||{}).canais||[]).some(x=>['email','chat','sms'].includes(x)))items.push({id:'canais',s:'on',v:'x'});
  const s=items.some(i=>i.s==='on')?'on':items.some(i=>i.s==='cli')?'cli':'off';
  const dec=items.filter(i=>i.s===s&&i.v&&i.id!=='canais');
  const explicitOn=s==='on'&&items.some(i=>i.s==='on'&&i.v);
  const pend=s==='on'&&!explicitOn?items.filter(i=>i.v==='').map(i=>i.id):[];
  return {s,why:s==='on'?'':'Termo: '+dec.map(i=>FLD[i.id].l+' = '+vLabel(i.id,i.v)).join('; '),pend};
}

const mkey=n=>String(n||'').trim().toLowerCase();
function build(p){
  const H=hols(p.hol||'sp'), G=adjBD(num(p.goLive),H), goAfter=p.goAfter||9, ov=p.ov||{}, blk=p.blk||{};
  const R=p.termo?ruleMap(p.termo):{};
  const phases=PH.map(ph=>{
    const steps=ph.s.map((s,i)=>({key:ph.n+'.'+(i+1),code:ph.n+'.'+(i+1),base:s[0],fund:s[1],phase:ph.n,extra:false}));
    (p.extras||[]).filter(x=>x.phase===ph.n).forEach(x=>steps.push({key:'x'+x.id,code:ph.n+'.'+(steps.length+1),base:x.title,fund:0,phase:ph.n,extra:true,xid:x.id,owner0:x.owner}));
    steps.forEach(st=>{
      const o=ov[st.key]||{};st.o=o;
      const r=R[st.key]||{s:'on',why:'',pend:[]};
      st.rule=r.s;st.why=r.why;st.pend=r.pend||[];
      st.off=o.force==='off'||(o.force!=='on'&&r.s==='off');
      st.manualOff=o.force==='off';st.manualOn=o.force==='on'&&r.s==='off';
      st.cli=!st.off&&r.s==='cli';
      st.title=st.cli?'Acompanhar entrega do cliente: '+st.base:st.base;
      st.owner=o.owner!=null?o.owner:(st.owner0||'');
      st.email=(st.owner?((p.mail||{})[mkey(st.owner)]||''):(o.email||'')).trim();
      st.mine=!st.email||st.email.toLowerCase()===ME_MAIL;
      st.status=o.status||'Não iniciado';
      st.done=!st.off&&st.status==='Concluído';
      st.pct=st.off?0:(st.done?100:(st.status==='Em andamento'?(o.pct!=null?o.pct:50):0));
    });
    const act=steps.filter(s=>!s.off);
    const d=blk[ph.n]!=null?+blk[ph.n]:2;
    return {n:ph.n,t:ph.t,steps,act,off:act.length===0,days:Math.max(.5,Math.round(d*2)/2||2),pp:ph.n>1&&(p.pp||{})[ph.n]===true,anc:0,post:ph.n>goAfter};
  });
  phases.forEach(ph=>{const v=(p.pp||{})[ph.n];if(typeof v==='number'&&v>=1&&v<ph.n){const t=phases[v-1];if(t&&t.post===ph.post)ph.anc=v}});
  const group=list=>{const gs=[];list.forEach((ph,i)=>{if(ph.pp&&i>0&&gs.length)gs[gs.length-1].push(ph);else gs.push([ph])});return gs};
  const preG=group(phases.filter(f=>!f.post&&!f.anc)), postG=group(phases.filter(f=>f.post&&!f.anc));
  const ulen=ph=>ph.off?0:ph.days*2;
  const U=preG.reduce((a,g)=>a+Math.max.apply(null,g.map(ulen)),0);
  const lastEnd=prevBD(G,H), fullDays=Math.floor(U/2), rem=U%2;
  let S,Sh=0;
  if(U===0){S=lastEnd;Sh=1}
  else if(fullDays>0){S=addBD(lastEnd,-(fullDays-1),H);if(rem){S=prevBD(S,H);Sh=1}}
  else{S=lastEnd;Sh=1}
  const span=(n,h,u)=>{const t=h+u,di=Math.floor(t/2),r=t%2;
    if(r===0){const en=addBD(n,di-1,H);return{en,nn:nextBD(en,H),nh:0}}
    const en=addBD(n,di,H);return{en,nn:en,nh:1}};
  const place=(groups,n0,h0)=>{
    let n=n0,h=h0,maxEnd=-Infinity;
    groups.forEach(g=>{
      let nx={nn:n,nh:h};
      g.forEach(ph=>{
        if(ph.off){ph.start=n;ph.startH=h;ph.end=n;ph.fin=n;ph.endMid=false;ph.steps.forEach(st=>{st.start=n;st.end=n});return}
        const r=span(n,h,ph.days*2);
        ph.start=n;ph.startH=h;ph.end=r.en;ph.endMid=r.nh===1;
        ph.steps.forEach(st=>{st.start=ph.start;st.end=st.o.due?adjBD(num(st.o.due),H):ph.end});
        ph.fin=Math.max(ph.end,...ph.act.map(z=>z.end));
        maxEnd=Math.max(maxEnd,ph.fin);
        if(r.nn>nx.nn||(r.nn===nx.nn&&r.nh>nx.nh))nx=r;
      });
      n=nx.nn;h=nx.nh;
    });
    return maxEnd===-Infinity?n0:maxEnd;
  };
  let preEnd=place(preG,S,Sh), postEnd=place(postG,G,0);
  // fases ancoradas: começam junto com a fase escolhida e não empurram a sequência
  phases.filter(f=>f.anc).forEach(ph=>{
    const t=phases[ph.anc-1];
    if(ph.off){ph.start=t.start;ph.startH=t.startH;ph.end=t.start;ph.fin=t.start;ph.endMid=false;ph.steps.forEach(st=>{st.start=t.start;st.end=t.start});return}
    const r=span(t.start,t.startH,ph.days*2);
    ph.start=t.start;ph.startH=t.startH;ph.end=r.en;ph.endMid=r.nh===1;
    ph.steps.forEach(st=>{st.start=ph.start;st.end=st.o.due?adjBD(num(st.o.due),H):ph.end});
    ph.fin=Math.max(ph.end,...ph.act.map(z=>z.end));
    if(ph.post)postEnd=Math.max(postEnd,ph.fin);else preEnd=Math.max(preEnd,ph.fin);
  });
  phases.forEach(ph=>{ph.pct=ph.act.length?ph.act.reduce((a,s)=>a+s.pct,0)/ph.act.length:0;ph.nDone=ph.act.filter(s=>s.done).length});
  const flat=[].concat.apply([],phases.map(f=>f.steps)), act=flat.filter(s=>!s.off);
  const T=todayN();
  flat.forEach(st=>{st.proj=p;st.late=!st.off&&!st.done&&st.end<T;st.lateDone=st.done&&st.o.doneAt&&num(st.o.doneAt)>st.end});
  const ab=p.termo&&p.termo.abertura?num(p.termo.abertura):null, W0=ab&&isFinite(ab)?ab:S;
  const pend=[];flat.forEach(st=>st.pend.forEach(id=>{if(pend.indexOf(id)<0)pend.push(id)}));
  return {p,H,G,goAfter,phases,flat,act,D:U/2,S,Sh,W0,hasAb:W0!==S||!!ab,lastEnd,preEnd,maxEnd:Math.max(preEnd,postEnd),overrun:preEnd>lastEnd,
    nOff:flat.length-act.length,nCli:act.filter(s=>s.cli).length,pend,
    prog:act.length?act.reduce((a,s)=>a+s.pct,0)/act.length:0,nDone:act.filter(s=>s.done).length,nLate:act.filter(s=>s.late).length,nBlk:act.filter(s=>s.status==='Bloqueado').length,
    next:act.filter(s=>!s.done).sort((a,b)=>a.end-b.end)[0]||null};
}

function projectTasks(p){
  const T=todayN();p.blk=p.blk||{};p.pp=p.pp||{};
  let c=build(p);const before=Object.assign({},p.blk),ppBefore=!!(p.pp[4]&&p.pp[8]);
  if(c.S>=T)return{ok:true,changed:false,c,notes:[]};
  if(!p.blk0){p.blk0=Object.assign({},p.blk);p.pp0=Object.assign({},p.pp)}
  if(!(p.pp[4]&&p.pp[8])){p.pp[4]=true;p.pp[8]=true;c=build(p)}
  let g=400;
  while(c.S<T&&g--){
    const cand=c.phases.filter(f=>!f.off&&f.n<=c.goAfter&&f.days>.5).sort((a,b)=>b.days-a.days)[0];
    if(!cand)break;
    p.blk[cand.n]=cand.days-.5;c=build(p);
  }
  const notes=[];
  if(!ppBefore)notes.push('RH em paralelo com TI e Facilities em paralelo com Testes');
  PH.forEach(f=>{const a=before[f.n]==null?2:before[f.n],b=p.blk[f.n]==null?2:p.blk[f.n];if(a!==b)notes.push(`${f.t}: ${fDias(a)} → ${fDias(b)}`)});
  return{ok:c.S>=T,changed:true,c,notes};
}

function timeline(c){

  for(let i=0;i<40;i++){const n=Math.floor(Date.UTC(y,m,1)/D0);if(n>b)break;if(n>=a)ax.push(`<span style="left:${pos(n).toFixed(2)}%">${fmt(n,{month:'short'}).replace('.','')}</span>`);m++;if(m>11){m=0;y++}}
  const marks=r=>{let s='';s+=`<i class="mk gl" style="left:${pos(c.G).toFixed(2)}%"></i>`;if(T>=a&&T<=b)s+=`<i class="mk td" style="left:${pos(T).toFixed(2)}%"></i>`;return s};

  `</div><div class="leg"><span><b style="background:var(--amber)"></b>Go Live ${fD(c.G)}</span><span><b style="background:var(--coral)"></b>Hoje</span><span>Barra cheia = progresso da fase</span></div>`;
}

function lateCalUpdate(id,key){ // atualiza o evento do Agenda, sem bloquear a tela

function findId(x,d){d=d||0;if(x==null||d>4)return null;

  if(typeof x==='object'){for(const k of ['eventId','id'])if(typeof x[k]==='string'&&x[k])return x[k];for(const k in x){const r=findId(x[k],d+1);if(r)return r}}return null}

async function syncProject(id){
  const p=P[id];if(!p||(SY[id]&&SY[id].run))return;
  const c=build(p),jobs=[];
  c.flat.forEach(st=>{const e=st.o.ev;if(st.off||!st.mine){if(e&&e!=='?')jobs.push({st,t:'d'})}else if(!e){if(!st.done)jobs.push({st,t:'c'})}else if(e!=='?'&&st.o.evSig!==sigOf(p,st))jobs.push({st,t:'u'})});
  if(!jobs.length){SY[id]={run:false,msg:'Tudo já está no Agenda.'};requestRender();return}
  const s=SY[id]={run:true,done:0,total:jobs.length,msg:''};let i=0,fail=0,stop=null,noId=0;requestRender();
  const worker=async()=>{while(i<jobs.length&&!stop){const j=jobs[i++],st=j.st,o=ovOf(p,st.key);
    try{
      if(j.t==='c'){const r=await callCal('create_event',evPayload(p,st));const ev=findId(r.payload)||findId((r.content||[]).map(b=>b.text||'').join('\n'));if(!ev)noId++;o.ev=ev||'?';o.evSig=sigOf(p,st)}
      else if(j.t==='d'){await callCal('delete_event',{eventId:o.ev});delete o.ev;delete o.evSig}
      else{await callCal('update_event',Object.assign({eventId:o.ev},evPayload(p,st)));o.evSig=sigOf(p,st)}
    }catch(e){fail++;if(AUTH.includes(e&&e.code))stop=e;else if(!stop&&fail===1)s.first=e}
    s.done++;if(s.done%8===0){save(id);requestRender()}}};
  await Promise.all([worker(),worker(),worker()]);
  save(id);
  s.run=false;
  s.msg=stop?calErrMsg(stop):(fail?`${jobs.length-fail} de ${jobs.length} enviadas. ${fail} falharam${s.first?' ('+(s.first.message||s.first.code)+')':''}. Clique de novo para tentar as que faltam.`:`${jobs.length} ${plural(jobs.length,'tarefa enviada','tarefas enviadas')} ao Agenda, como eventos de dia inteiro no prazo de cada etapa.${noId?' Em '+noId+' o Agenda não devolveu o ID, então elas não serão atualizadas sozinhas.':''}`);
  requestRender();
}

const CP2={warn:'#E8A100',okBg:'#EAF7F0',warnBg:'#FFF6DD',badBg:'#FDEDEC'};
function reportInfo(c,T){
  const exp=c.act.length?c.act.filter(s=>s.end<=T).length/c.act.length*100:0,act=c.prog,left=countBD(T,c.G,c.H);
  const wk=c.act.filter(s=>s.done&&s.o.doneAt&&T-num(s.o.doneAt)<=6&&T-num(s.o.doneAt)>=0);
  const full=c.phases.filter(f=>!f.off&&f.act.length&&f.nDone===f.act.length&&f.n<=c.goAfter);
  let st='ok';const gap=exp-act;
  if(c.overrun||(c.nLate>0&&gap>15)||(left<=5&&act<80))st='bad';else if(c.nLate>0||gap>5||c.nBlk>0)st='warn';
  const pos=[],att=[];
  if(wk.length)pos.push(wk.length+' '+plural(wk.length,'etapa concluída','etapas concluídas')+' na semana');
  if(full.length)pos.push(full.length===1?'Bloco "'+full[0].t+'" concluído':full.length+' blocos concluídos ('+full.map(f=>f.t).slice(-2).join(', ')+')');
  if(!c.nLate&&act>=exp-5)pos.push('Dentro do cronograma: '+Math.round(act)+'% real contra '+Math.round(exp)+'% previsto');
  if(left>0&&!c.overrun&&st==='ok'&&left>=10)pos.push('Go Live mantido em '+fD(c.G)+' com '+left+' dias úteis de margem');
  if(c.nLate){const l=c.act.filter(s=>s.late&&!s.done).slice(0,2);att.push(c.nLate+' '+plural(c.nLate,'etapa atrasada','etapas atrasadas')+': '+l.map(s=>s.base).join('; ')+(c.nLate>2?'…':''))}
  if(c.nBlk)att.push(c.nBlk+' '+plural(c.nBlk,'etapa bloqueada','etapas bloqueadas'));
  if(c.overrun)att.push('Plano passa do Go Live: replanejar prazo ou data');
  else if(gap>5&&!c.nLate)att.push('Ritmo abaixo do previsto ('+Math.round(act)+'% contra '+Math.round(exp)+'%)');
  if(c.nCli)att.push(c.nCli+' '+plural(c.nCli,'entrega','entregas')+' do cliente em acompanhamento');
  if(c.p.termo&&Object.keys(c.p.termo).length&&c.pend&&c.pend.length)att.push('Termo de abertura com '+c.pend.length+' respostas pendentes');
  if(c.p.blk0)att.push('Prazos compactados para caber no Go Live');

  else if(a==='sync'&&p)syncProject(id);
  else if(a==='ics'&&p)exportICS(id);
  else if(a==='img'&&p)exportImage(id);
  else if(a==='imgall')exportPortfolioImage();
  else if(a==='rep'&&p)exportStatus([id]);
  else if(a==='repall'){const ids=Object.values(P).sort((x,y)=>(x.created||0)-(y.created||0)).map(x=>x.id);(async()=>{for(const i of ids){await exportStatus([i]);await new Promise(r=>setTimeout(r,400))}if(ids.length>1)toast(ids.length+' imagens geradas, uma por projeto')})()}
  else if(a==='project'&&p){const r=projectTasks(p);save(id);requestRender();toast(!r.changed?'O plano já cabe até o Go Live. Nada a ajustar.':r.ok?'Tarefas projetadas: '+r.notes.length+' ajustes para caber no Go Live':'Mesmo no mínimo não cabe: ajuste o Go Live ou desative etapas')}
  else if(a==='restore'&&p&&p.blk0){p.blk=p.blk0;p.pp=p.pp0||{};delete p.blk0;delete p.pp0;save(id);requestRender();toast('Durações restauradas')}
  else if(a==='xopen'){xform[id]=+b.dataset.n;openPh[id+':'+b.dataset.n]=true;requestRender()}
  else if(a==='xclose'){delete xform[id];requestRender()}
  else if(a==='xadd'&&p){const t=document.getElementById('xf-t').value.trim();if(!t){toast('Dê um nome para a etapa');return}
    p.extras=p.extras||[];p.extras.push({id:uid(),phase:+b.dataset.n,title:t,owner:document.getElementById('xf-o').value.trim()});delete xform[id];save(id);requestRender()}
  else if(a==='xdel'&&p){const x=(p.extras||[]).find(z=>z.id===b.dataset.x),o=(p.ov||{})['x'+b.dataset.x];
    if(o&&o.ev&&o.ev!=='?')callCal('delete_event',{eventId:o.ev}).catch(()=>{});
    p.extras=(p.extras||[]).filter(z=>z.id!==b.dataset.x);if(p.ov)delete p.ov['x'+b.dataset.x];save(id);requestRender();toast('Etapa removida')}
  else if(a==='del'&&p){
    if(delAsk!==id){delAsk=id;requestRender();return}
    const evs=Object.values(p.ov||{}).map(o=>o.ev).filter(v=>v&&v!=='?');delAsk=null;
    delete P[id];save(id);view='portfolio';requestRender();toast('Projeto excluído');
    for(const ev of evs){try{await callCal('delete_event',{eventId:ev})}catch(er){if(AUTH.includes(er&&er.code))break}}
  }
  else if(a==='delno'){delAsk=null;requestRender()}
  else if(a==='btab'){btab[id]=b.dataset.v;lastFocus=null;requestRender();window.scrollTo({top:0})}
  else if(a==='ptab'){ptab[id]=b.dataset.v;lastFocus=null;requestRender()}
  else if(a==='tnew'&&p){p.termo={};save(id);requestRender()}
  else if(a==='cadd'||a==='cdel'){const sc=b.dataset.tp,T0=sc==='w'?W.termo:(P[sc]||{}).termo;if(T0){const L=ctc(T0).map(c=>Object.assign({},c));if(a==='cadd')L.push({n:'',a:'',e:'',t:''});else L.splice(+b.dataset.ci,1);T0.contatos=L;delete T0.contato;delete T0.email;delete T0.tel;if(sc!=='w')save(sc);lastFocus=null;requestRender()}}
  else if(a==='timport')importTermo(b.dataset.tp);
  else if(a==='texport')exportTermo(b.dataset.tp);
  else if(a==='force'&&p){const c0=build(p),st=c0.flat.find(z=>z.key===b.dataset.k);if(!st)return;const o=ovOf(p,st.key);
    if(b.dataset.v==='off')o.force='off';else{if(st.rule==='off')o.force='on';else delete o.force}
    save(id);requestRender()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.t&&t.dataset.tp==='w'){
    applyTermo(W.termo,t);const id=t.dataset.t;
    if(id==='nome'&&(!W.name||W.name===W.autoName)){W.name=W.termo.nome;W.autoName=W.termo.nome;const el=document.getElementById('w-name');if(el)el.value=W.name}
    if(id==='inicioOp'&&(!W.goLive||W.goLive===W.autoGL)){W.goLive=W.termo.inicioOp;W.autoGL=W.goLive;const el=document.getElementById('w-gl');if(el)el.value=W.goLive}
    wizPreview();return}
  if(t.dataset&&t.dataset.f==='blk'&&t.dataset.p){clearTimeout(t._bt);t._bt=setTimeout(()=>{if(document.body.contains(t)&&t.value!=='')t.dispatchEvent(new Event('change',{bubbles:true}))},900);return}
  if(!t.dataset||!t.dataset.w)return;
  const v=t.type==='number'?(+t.value||0):t.value;setPath(W,t.dataset.w,v);
  if(['goAfter','hol','goLive','name'].includes(t.dataset.w)||t.dataset.w.startsWith('nx')||t.dataset.w.startsWith('blk'))wizPreview();
});
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset;if(!d)return;
  if(d.t){if(d.tp==='w')return;const p0=P[d.tp];if(p0){p0.termo=p0.termo||{};applyTermo(p0.termo,t);save(p0.id);requestRender()}return}
  if(d.w){if(d.w==='goAfter')W.goAfter=+t.value;return}
  const p=P[d.p];
  if(t.matches('[data-act="pp"]')&&p){p.pp=p.pp||{};const v=t.value;if(v==='seq')delete p.pp[d.n];else if(v==='prev')p.pp[d.n]=true;else p.pp[d.n]=+v;save(p.id);requestRender();return}
  if(!p)return;
  if(d.f==='pname'){p.name=t.value.trim()||p.name;save(p.id);requestRender();return}
  if(d.f==='blk'){p.blk=p.blk||{};p.blk[d.n]=Math.max(.5,Math.round((parseFloat(String(t.value).replace(',','.'))||2)*2)/2);save(p.id);requestRender();return}
  if(d.f==='recado'){p.recado=t.value.trim();save(p.id);return}
  if(d.f==='golive'){if(t.value){p.goLive=t.value;const r=projectTasks(p);save(p.id);requestRender();if(r.changed)toast(r.ok?'Go Live alterado: projetei as tarefas para caber':'Go Live alterado: mesmo no mínimo não cabe')}return}
  if(!d.k)return;
  const o=ovOf(p,d.k),c0=build(p),st0=c0.flat.find(s=>s.key===d.k);
  if(d.f==='owner')o.owner=t.value.trim();
  else if(d.f==='email'){const v=t.value.trim(),ow=st0?st0.owner:'';if(ow){p.mail=p.mail||{};if(v)p.mail[mkey(ow)]=v;else delete p.mail[mkey(ow)]}else{if(v)o.email=v;else delete o.email}}
  else if(d.f==='notes')o.notes=t.value.trim();
  else if(d.f==='pct')o.pct=Math.min(100,Math.max(0,parseInt(t.value,10)||0));
  else if(d.f==='due'){const blockEnd=st0?c0.phases.find(f=>f.n===st0.phase).end:null;if(!t.value||(blockEnd!=null&&t.value===iso(blockEnd)))delete o.due;else o.due=t.value}
  else if(d.f==='status'){setStatus(p,d.k,t.value);if(t.value==='Concluído')toast('Etapa concluída')}
  save(p.id);requestRender();if(d.f==='status')lateCalUpdate(p.id,d.k);
});
document.addEventListener('toggle',e=>{const t=e.target;if(t.matches&&t.matches('details.ph[data-ph]'))openPh[t.dataset.ph]=t.open;if(t.matches&&t.matches('details.tsec[data-sec]'))secOpen[t.dataset.sec]=t.open},true);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches&&e.target.matches('input[type=text],input[type=number],input[type=date]'))e.target.blur()});

/* ---------- boot ---------- */
render();
(async()=>{
  db=await use('db');
  if(db){try{db.collection('projects').onSnapshot(onSnap,err=>{loaded=true;setSync('err',err&&err.code);requestRender()})}catch(e){loaded=true;setSync('err');requestRender()}}
  else{loaded=true;setSync('none');requestRender()}
  mcpNs=await use('mcp');
})();
</script>
